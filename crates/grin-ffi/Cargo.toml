[package]
name = "grin-ffi"
version = "0.1.0"
edition = "2021"
publish = false
description = "C ABI over grin-wallet for package:grin"
license = "Apache-2.0"
# include/grin_ffi.h is the committed C header (regenerated by build.rs).
include = ["Cargo.toml", "build.rs", "cbindgen.toml", "include/**", "src/**", "tests/**"]

[lib]
name = "grin_ffi"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = []
# Exports grin_test_panic, grin_test_create_wallet and grin_test_mine_blocks
# (an in-process chain via impls::test_framework). Never in release builds;
# the nm gate checks that.
test-utils = []

[dependencies]
grin_wallet_impls = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f", default-features = false, features = ["rustls"] }
grin_wallet_libwallet = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_wallet_config = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_wallet_util = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_core = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_keychain = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_chain = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_store = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
grin_util = { git = "ssh://git@git.cypherstack.com:222/sneurlax/grin-wallet.git", rev = "64d361f2e49fa6d544cf0236417da48a99444b2f" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
uuid = { version = "0.8", features = ["serde", "v4"] }
# Same major versions the fork already uses, so nothing is duplicated.
rand = "0.6"
url = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cbindgen = "0.29"
