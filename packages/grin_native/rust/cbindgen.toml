# C header for grin-ffi. build.rs writes it to $OUT_DIR/grin_ffi.h and, when
# GRIN_FFI_WRITE_HEADER=1 is set, copies it to include/grin_ffi.h, which is
# committed as the ABI contract.
language = "C"
include_guard = "GRIN_FFI_H"
cpp_compat = true
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
autogen_warning = "/* Generated by cbindgen from packages/grin_native/rust (build.rs). Do not edit by hand. */"
documentation = true
documentation_style = "c"
style = "both"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
# GrinErrorCode is not used in any signature, so it has to be listed.
include = ["GrinErrorCode"]
item_types = ["enums", "structs", "functions"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
args = "auto"

[defines]
"feature = test-utils" = "GRIN_FFI_TEST_UTILS"
