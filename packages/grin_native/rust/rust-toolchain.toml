[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["rustfmt", "clippy"]

# Every target the build hook may be asked for. Rust 1.98 and later is
# needed for Apple binaries that the iOS 27 and macOS 27 dyld accepts.
targets = [
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
