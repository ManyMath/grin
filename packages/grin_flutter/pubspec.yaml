name: grin_flutter
description: Flutter glue for package:grin. A default wallet directory, an app lifecycle observer, and re-exports; the native library comes from package:grin's build hook.
version: 0.1.0
repository: https://github.com/cypherstack/grin
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  grin: ^0.1.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0
