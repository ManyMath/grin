name: grin_flutter_example
description: Smoke-test app for grin_flutter. Generates a mnemonic, creates a wallet and shows its Slatepack address through the real native library.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  grin_flutter: ^0.1.0
  path: ^1.9.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
