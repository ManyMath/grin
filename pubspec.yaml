name: grin_workspace
description: Pub workspace for the grin and grin_native packages. Not a package.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/grin
  - packages/grin_native
  - packages/grin_native/example
  - packages/grin_native/test_consumer

# Applies to every build resolved from this workspace (dart test, the
# example app). Stack Wallet sets its own block; see
# packages/grin_native/README.md.
hooks:
  user_defines:
    grin_native:
      # Export grin_test_* so dart test can drive an in-process chain.
      # Never set it in an app.
      test_utils: true
