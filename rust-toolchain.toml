[toolchain]
channel = "1.94.0"
profile = "minimal"
components = ["rustfmt", "clippy"]

# Every target the cargo build mode may be asked for. build-config.json
# names the same Rust version; the flake fails evaluation if they differ.
targets = [
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
